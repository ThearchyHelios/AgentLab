[project]
name = "agentlab-backend"
version = "0.1.0"
description = "AgentLab — 可视化 Agent 编排实验台后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-mcp-adapters",
    "mcp",
    "numpy>=2.0",
    "jsonschema>=4.23",
    "beautifulsoup4>=4.12",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# microVM 沙箱（独立 Linux 内核）。约 35MB wheel + 首次约 50MB 运行时下载，
# 再加一次 OCI 镜像拉取（实测约 55s），所以不进默认安装。
# environment.yml 里已经带上了；单独装用 `pip install 'agentlab-backend[microvm]'`。
microvm = ["microsandbox>=0.6"]
# 测试：conda 环境默认不装，跑测试前 pip install 'agentlab-backend[dev]'
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
