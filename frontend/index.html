<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentLab · 可视化 Agent 编排实验台</title>
    <script>
      // 首帧之前定主题。偏好的真源在后端设置里，但等接口回来再切，浅色用户每次
      // 打开都会先看到一帧深色；src/lib/theme.ts 每次应用主题都会把偏好写到这个
      // 键上，两边的键名和取值要一致。「跟随系统」不写属性，交给 CSS 的媒体查询
      try {
        var pref = localStorage.getItem('agentlab.theme')
        if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref)
      } catch (e) {}
    </script>
    <style>
      /* 样式表加载前的那一瞬间页面只有浏览器默认底色。先把底色按主题铺上，
         不然深色用户会先闪一下白、浅色用户先闪一下黑；取值同 index.css 的 --bg */
      html { background: #0b0e14; color-scheme: dark; }
      html[data-theme='light'] { background: #f6f7f9; color-scheme: light; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) { background: #f6f7f9; color-scheme: light; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
